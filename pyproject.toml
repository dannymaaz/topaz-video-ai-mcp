[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topaz-video-ai-mcp"
version = "2.0.0"
description = "Model Context Protocol (MCP) server for Topaz Video AI. Autonomous frame analysis, smart model selection (Iris/Proteus), and realistic anti-plastic video enhancement for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Topaz Video AI MCP Contributors" }
]
keywords = [
    "topaz-video-ai",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "claude-desktop",
    "cursor-ai",
    "video-upscaling",
    "video-enhancement",
    "super-resolution",
    "ffmpeg",
    "face-restoration"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mcp>=1.2.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0"
]

[project.urls]
Homepage = "https://github.com/dannymaaz/topaz-video-ai-mcp"
Repository = "https://github.com/dannymaaz/topaz-video-ai-mcp.git"
Issues = "https://github.com/dannymaaz/topaz-video-ai-mcp/issues"

[project.scripts]
topaz-video-ai-mcp = "topaz_video_ai_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topaz_video_ai_mcp*"]
